[project]
name = "visa-jobs-api"
version = "0.1.0"
description = "FastAPI service that aggregates visa-sponsoring job listings from Hacker News and LinkedIn into one emailed digest"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "langdetect>=1.0.9",
    "tenacity>=8.5",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
visa-jobs-digest = "visa_jobs_api.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
