name: Daily visa jobs digest

on:
  schedule:
    # 03:30 UTC = 09:00 IST (UTC+5:30). GitHub Actions cron is always UTC --
    # adjust this if the target timezone isn't IST.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run digest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # Each `|| <n>` fallback mirrors config.py's own Python-side
          # default exactly. A GitHub Actions repo Variable that was never
          # created resolves to an empty string, not an absent env var --
          # pydantic-settings treats those differently (an empty string
          # fails int-parsing instead of falling back to the field
          # default), so without these fallbacks a missing repo Variable
          # crashes the whole scheduled run. This exact failure mode is
          # what happened when the Indeed vars below were never added
          # after the Indeed source was merged.
          HN_LLM_CONCURRENCY: ${{ vars.HN_LLM_CONCURRENCY || 5 }}
          LINKEDIN_SEARCH_CONCURRENCY: ${{ vars.LINKEDIN_SEARCH_CONCURRENCY || 10 }}
          LINKEDIN_DESCRIPTION_CONCURRENCY: ${{ vars.LINKEDIN_DESCRIPTION_CONCURRENCY || 10 }}
          LINKEDIN_LLM_CONCURRENCY: ${{ vars.LINKEDIN_LLM_CONCURRENCY || 16 }}
          INDEED_SEARCH_CONCURRENCY: ${{ vars.INDEED_SEARCH_CONCURRENCY || 4 }}
          INDEED_DESCRIPTION_CONCURRENCY: ${{ vars.INDEED_DESCRIPTION_CONCURRENCY || 4 }}
          INDEED_LLM_CONCURRENCY: ${{ vars.INDEED_LLM_CONCURRENCY || 16 }}
          LINKEDIN_POSTS_PER_PAGE: ${{ vars.LINKEDIN_POSTS_PER_PAGE || 10 }}
          LINKEDIN_MAX_PAGES_PER_QUERY: ${{ vars.LINKEDIN_MAX_PAGES_PER_QUERY || 3 }}
          INDEED_POSTS_PER_PAGE: ${{ vars.INDEED_POSTS_PER_PAGE || 15 }}
          INDEED_MAX_PAGES_PER_QUERY: ${{ vars.INDEED_MAX_PAGES_PER_QUERY || 4 }}
        run: visa-jobs-digest
