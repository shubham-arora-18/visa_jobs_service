name: Daily visa jobs digest

on:
  # No schedule trigger -- Indeed search via Selenium is blocked from
  # GitHub Actions' runner IP (and from a Decodo datacenter proxy tested
  # as an alternative), but works cleanly from a residential IP. The
  # digest is running locally instead (scripts/run_digest_locally.sh, via
  # a macOS launchd LaunchAgent) until this is resolved -- see
  # DECISIONS.md's "Indeed search via Selenium works from a residential
  # IP..." entry. workflow_dispatch is kept so this can still be triggered
  # manually for testing.
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      # Indeed's search pages go through Selenium/real headless Chrome now
      # (see src/visa_jobs_api/sources/indeed/selenium_client.py), not
      # Bright Data -- this guarantees a Chrome binary is present on the
      # runner rather than relying on whatever ubuntu-latest happens to
      # ship. Selenium's own Selenium Manager auto-downloads a matching
      # chromedriver at run time, so no separate driver step is needed.
      - uses: browser-actions/setup-chrome@v1

      - name: Run digest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          INDEED_PAGE_SETTLE_SECONDS: ${{ vars.INDEED_PAGE_SETTLE_SECONDS }}
          HN_LLM_CONCURRENCY: ${{ vars.HN_LLM_CONCURRENCY }}
          LINKEDIN_SEARCH_CONCURRENCY: ${{ vars.LINKEDIN_SEARCH_CONCURRENCY }}
          LINKEDIN_DESCRIPTION_CONCURRENCY: ${{ vars.LINKEDIN_DESCRIPTION_CONCURRENCY }}
          LINKEDIN_LLM_CONCURRENCY: ${{ vars.LINKEDIN_LLM_CONCURRENCY }}
          INDEED_SEARCH_CONCURRENCY: ${{ vars.INDEED_SEARCH_CONCURRENCY }}
          INDEED_DESCRIPTION_CONCURRENCY: ${{ vars.INDEED_DESCRIPTION_CONCURRENCY }}
          INDEED_LLM_CONCURRENCY: ${{ vars.INDEED_LLM_CONCURRENCY }}
          LINKEDIN_POSTS_PER_PAGE: ${{ vars.LINKEDIN_POSTS_PER_PAGE }}
          LINKEDIN_MAX_PAGES_PER_QUERY: ${{ vars.LINKEDIN_MAX_PAGES_PER_QUERY }}
          INDEED_POSTS_PER_PAGE: ${{ vars.INDEED_POSTS_PER_PAGE }}
          INDEED_MAX_PAGES_PER_QUERY: ${{ vars.INDEED_MAX_PAGES_PER_QUERY }}
          INDEED_MIN_CARDS_PER_PAGE: ${{ vars.INDEED_MIN_CARDS_PER_PAGE }}
          DIGEST_RUN_TIMEOUT_SECONDS: ${{ vars.DIGEST_RUN_TIMEOUT_SECONDS }}
        run: visa-jobs-digest
